<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Page Not Found — Blackwall Studio</title>
  <meta name="description" content="The page you're looking for doesn't exist — but the games we build do." />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />

  <meta property="og:title" content="404 · Page Not Found — Blackwall Studio" />
  <meta property="og:description" content="The page you're looking for doesn't exist — but the games we build do." />
  <meta property="og:image" content="https://blackwall-studio.github.io/blackwallstudio.github.io/favicon.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="404 · Page Not Found — Blackwall Studio" />

  <meta name="theme-color" content="#0a0a0f" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ============================================
       RESET & BASE
    ============================================ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      line-height: 1.6;
      position: relative;
    }

    /* ============================================
       ANIMATED BACKGROUND
    ============================================ */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-gradient {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 50% 100%, rgba(0, 240, 255, 0.04) 0%, transparent 100%),
        radial-gradient(ellipse 50% 40% at 80% 20%, rgba(124, 58, 237, 0.04) 0%, transparent 100%),
        radial-gradient(ellipse 40% 50% at 20% 80%, rgba(0, 102, 255, 0.03) 0%, transparent 100%);
    }

    /* Animated floating dots */
    .bg-dots {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(0, 240, 255, 0.12) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: dotDrift 60s linear infinite;
    }

    @keyframes dotDrift {
      0% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(10px, -10px) rotate(2deg); }
      50% { transform: translate(-5px, 15px) rotate(-1deg); }
      75% { transform: translate(15px, 5px) rotate(1deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    /* Animated grid lines */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      animation: gridPulse 8s ease-in-out infinite;
    }

    @keyframes gridPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* ============================================
       THEME TOGGLE
    ============================================ */
    .theme-toggle-404 {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 10;
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 0.4rem 0.5rem;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      transition: border-color 0.3s ease, background 0.3s ease;
    }
    .theme-toggle-404:hover {
      border-color: rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.05);
    }
    .theme-toggle-404-icon {
      display: inline-block;
      transition: transform 0.4s ease;
    }

    /* ============================================
       CONTENT
    ============================================ */
    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2rem;
      max-width: 560px;
    }

    /* Logo link */
    .logo-link {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.02em;
      margin-bottom: 3rem;
      opacity: 0;
      transform: translateY(-10px);
      animation: fadeDown 0.6s ease 0.2s forwards;
    }
    .logo-link img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1.5px solid #00f0ff;
    }

    /* 404 Number */
    .four-oh-four {
      font-size: clamp(6rem, 18vw, 12rem);
      font-weight: 900;
      letter-spacing: -0.06em;
      line-height: 1;
      background: linear-gradient(135deg, #00f0ff 0%, #0066ff 50%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.4s forwards;
    }

    /* Heading */
    .content h1 {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.75rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.6s forwards;
    }

    /* Description */
    .content p {
      color: rgba(255,255,255,0.5);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.8s forwards;
    }

    /* Buttons */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      opacity: 0;
      animation: fadeUp 0.8s ease 1s forwards;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 2rem;
      background: linear-gradient(135deg, #00f0ff, #0066ff);
      color: #0a0a0f;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 240, 255, 0.25);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 2rem;
      background: rgba(255,255,255,0.05);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.25);
    }

    /* Quick links */
    .quick-links {
      margin-top: 3rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      justify-content: center;
      opacity: 0;
      animation: fadeUp 0.8s ease 1.2s forwards;
    }
    .quick-links a {
      color: rgba(255,255,255,0.3);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      transition: color 0.3s ease;
      position: relative;
    }
    .quick-links a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1px;
      background: #00f0ff;
      transition: width 0.3s ease;
    }
    .quick-links a:hover {
      color: #00f0ff;
    }
    .quick-links a:hover::after {
      width: 100%;
    }

    /* Status */
    .status-code {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.12);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      z-index: 2;
    }

    /* ============================================
       KEYFRAMES
    ============================================ */
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeDown {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============================================
       LIGHT MODE
    ============================================ */
    [data-theme="light"] body {
      background: #f5f5f7;
      color: #1a1a2e;
    }
    [data-theme="light"] .bg-gradient {
      background:
        radial-gradient(ellipse 70% 50% at 50% 100%, rgba(0, 100, 200, 0.03) 0%, transparent 100%),
        radial-gradient(ellipse 50% 40% at 80% 20%, rgba(124, 58, 237, 0.03) 0%, transparent 100%);
    }
    [data-theme="light"] .bg-dots {
      background-image: radial-gradient(rgba(0, 0, 0, 0.08) 1px, transparent 1px);
    }
    [data-theme="light"] .bg-grid {
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
    }
    [data-theme="light"] .logo-link {
      color: #1a1a2e;
    }
    [data-theme="light"] .content h1 {
      color: #1a1a2e;
    }
    [data-theme="light"] .content p {
      color: rgba(0,0,0,0.5);
    }
    [data-theme="light"] .btn-secondary {
      color: #1a1a2e;
      border-color: rgba(0,0,0,0.12);
    }
    [data-theme="light"] .btn-secondary:hover {
      background: rgba(0,0,0,0.04);
      border-color: rgba(0,0,0,0.2);
    }
    [data-theme="light"] .quick-links a {
      color: rgba(0,0,0,0.3);
    }
    [data-theme="light"] .quick-links a:hover {
      color: #0066cc;
    }
    [data-theme="light"] .quick-links a::after {
      background: #0066cc;
    }
    [data-theme="light"] .status-code {
      color: rgba(0,0,0,0.08);
    }
    [data-theme="light"] .theme-toggle-404 {
      border-color: rgba(0,0,0,0.12);
    }
    [data-theme="light"] .theme-toggle-404:hover {
      background: rgba(0,0,0,0.04);
      border-color: rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <!-- Background -->
  <div class="bg">
    <div class="bg-gradient"></div>
    <div class="bg-dots"></div>
    <div class="bg-grid"></div>
  </div>

  <!-- Theme toggle -->
  <button id="themeToggle404" class="theme-toggle-404" aria-label="Toggle light/dark mode">
    <span class="theme-toggle-404-icon" id="themeIcon404">☀️</span>
  </button>

  <!-- Main content -->
  <main class="content">
    <a href="/" class="logo-link">
      <img src="favicon.png" alt="Blackwall Studio" width="32" height="32" />
      Blackwall Studio
    </a>

    <div class="four-oh-four">404</div>
    <h1>Signal Lost</h1>
    <p>
      The page you were looking for doesn't exist on this node. It may have
      been moved, renamed, or never connected to begin with.
    </p>

    <div class="actions">
      <a href="/" class="btn-primary">↩ Back to Base</a>
      <a href="https://github.com/Blackwall-Studio" target="_blank" rel="noopener" class="btn-secondary">⌨ Explore on GitHub</a>
    </div>

    <nav class="quick-links">
      <a href="/#about">About</a>
      <a href="/#services">Services</a>
      <a href="/#tools">Tools</a>
      <a href="/#projects">Projects</a>
      <a href="/#team">Team</a>
      <a href="/#news">News</a>
      <a href="/#contact">Contact</a>
    </nav>
  </main>

  <div class="status-code">HTTP 404 · Not Found</div>

  <script>
    // --- Log 404 hits for broken-link tracking ---
    (function() {
      try {
        const hit = {
          url: window.location.href,
          referrer: document.referrer || '(direct)',
          timestamp: new Date().toISOString()
        };
        console.log('[BW 404]', hit.url, '←', hit.referrer);
        const log = JSON.parse(localStorage.getItem('bw-404-log') || '[]');
        log.push(hit);
        // Keep only the last 50 entries
        if (log.length > 50) log.splice(0, log.length - 50);
        localStorage.setItem('bw-404-log', JSON.stringify(log));
      } catch (e) { /* localStorage may be unavailable */ }
    })();

    // --- Theme toggle ---
    const savedTheme = localStorage.getItem('bw-theme');
    const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    const isLight = savedTheme === 'light' || (!savedTheme && prefersLight);
    if (isLight) {
      document.documentElement.setAttribute('data-theme', 'light');
    }

    const btn = document.getElementById('themeToggle404');
    const icon = document.getElementById('themeIcon404');
    if (btn && icon) {
      icon.textContent = isLight ? '🌙' : '☀️';
      btn.addEventListener('click', () => {
        const html = document.documentElement;
        const currentlyLight = html.getAttribute('data-theme') === 'light';
        if (currentlyLight) {
          html.removeAttribute('data-theme');
          localStorage.setItem('bw-theme', 'dark');
          icon.textContent = '☀️';
        } else {
          html.setAttribute('data-theme', 'light');
          localStorage.setItem('bw-theme', 'light');
          icon.textContent = '🌙';
        }
      });
    }
  </script>
</body>
</html>
